service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  # Error budget calculation:
  # - Với 10,000 requests trong 28 ngày: error budget = 10,000 * 0.5% = 50 requests
  # - Với 1,000 requests trong 28 ngày: error budget = 1,000 * 0.5% = 5 requests
  # - Nếu baseline error rate ~0.5%, ta chỉ còn 25 requests budget (rất ít)
  # - Ngưỡng latency 3000ms phản ánh P95 baseline thực tế của hệ thống
  note: Baseline cho thấy P95 latency ~150ms, error rate ~0.1%. Với 99.5% SLO,
        ta có thể chấp nhận tăng error rate lên 0.5% trước khi alert.
        Error budget = total_requests * 0.5%.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
